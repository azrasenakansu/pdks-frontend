<div class=" flex flex-col w-full space-y-8 !overflow-y-auto h-full">
    <div class="w-full  rounded-xl flex space-x-8 place-content-between items-center">
        <div class="flex flex-col space-y-3">
            <h1 class="m-0">Etiket Yönetimi</h1>
            <p class="m-0">Sistemde tanımlı etiketleri bu ekran üzerinden yönetebilirsiniz.</p>
        </div>
        <p-button label="Etiket Oluştur" [outlined]="true" icon="pi pi-plus" (onClick)="showDialog(null)"></p-button>
    </div>
    <p-table class="h-full" [columns]="cols" [value]="data()" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngFor="let col of columns">
                    {{ col.header }}
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr>
                <td *ngFor="let col of columns">
                    @if(col.field === 'operations') {
                        <div class="flex">
                            <p-button [rounded]="true" [text]="true" (onClick)="showDialog(rowData)" icon="pi pi-pencil"></p-button>
                            <p-button [rounded]="true" [text]="true" (onClick)="delete(rowData._id)" icon="pi pi-trash"></p-button>
                        </div>
                    }
                    @else {
                        {{ rowData[col.field] }}
                    }
                </td>
            </tr>
        </ng-template>
    </p-table>

</div>
