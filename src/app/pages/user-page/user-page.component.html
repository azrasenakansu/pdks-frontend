<div class=" flex flex-col w-full space-y-8 !overflow-y-auto h-full">
    <div class="w-full  rounded-xl flex space-x-8 place-content-between items-center">
        <div class="flex flex-col space-y-3">
            <h1 class="m-0">Kullanıcı Yönetimi</h1>
            <p class="m-0">Sisteme kullanıcı eklemek/silmek/düzenlemek için bu ekranı kullanabilirsiniz.</p>
        </div>
        <p-button label="Kullanıcı Oluştur" [outlined]="true" icon="pi pi-plus" (onClick)="showDialog(null)"></p-button>
    </div>
    <p-table class="h-full" [columns]="cols" [value]="data()" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngFor="let col of columns">
                    {{ col.header }}
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr>
                <td *ngFor="let col of columns">
                    <ng-container *ngIf="col.field === 'operations'; else dataTemplate">
                        <div class="flex">
                            <p-button [rounded]="true" [text]="true" (onClick)="showDialog(rowData)"
                                icon="pi pi-pencil"></p-button>
                            <p-button [rounded]="true" [text]="true" (onClick)="delete(rowData.tckn)"
                                icon="pi pi-trash"></p-button>
                            <p-button [rounded]="true" [text]="true" (onClick)="resetPassword(rowData.tckn)"
                                icon="pi pi-lock-open"></p-button>
                        </div>
                    </ng-container>
                    <ng-template #dataTemplate>
                        {{ col.field === 'role.authority' ? rowData.role.authority : rowData[col.field] }}
                    </ng-template>
                </td>
            </tr>
        </ng-template>
    </p-table>

</div>
