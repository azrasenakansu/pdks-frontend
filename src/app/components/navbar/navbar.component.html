<p-confirmDialog></p-confirmDialog> 
<div class="flex h-28 flex-row items-center bg-white px-8 drop-shadow-md">
  <img src="proven.svg" class="h-14 cursor-default" />
  <div class="flex flex-1 justify-end">
    <div #user (click)="menu.toggle($event)" class="flex place-content-end  space-x-2 rounded-xl hover:bg-gray-100 border p-2 border-solid border-gray-200">
      <div class="flex flex-col items-end px-2">
        <span class="text-lg cursor-default">{{state.$currentUser()}}</span>
        <span class="text-sm text-gray-400 cursor-default">{{state.$currentRole()}}</span>
      </div>
      <div class="h-12 w-12 rounded-full bg-sky-700"></div>
      <p-menu #menu appendTo="body" styleClass="w-auto absolute !left-[initial] !right-8" [model]="items" [popup]="true"></p-menu>
    </div>
  </div>
</div>
