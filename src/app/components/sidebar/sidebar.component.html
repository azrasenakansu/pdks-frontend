<div class="bg-white rounded-xl w-full h-full flex flex-col items-center space-y-2 overflow-auto">

  <div class="py-2"></div>

  @for (item of availableMenus(); track $index) {
    <div (click)="onMenuClick(item.route)" class="hover:bg-gray-200 w-10/12 py-3 rounded-lg flex-row flex items-center space-x-3">
      @if (item.isSelected(currentPath())) {
        <i [class]="item.icon" class="pi ml-3" style="font-size: 1.25rem" ></i>
        <span class="cursor-default font-semibold">{{item.name}}</span>
      }
      @else {
        <i [class]="item.icon" class="pi ml-3 text-gray-700" style="font-size: 1.25rem" ></i>
        <span class="cursor-default font-normal text-gray-700">{{item.name}}</span>
      }
    </div>
  }

  <div class="py-2"></div>

</div>
